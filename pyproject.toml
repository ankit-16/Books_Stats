[project]
name = "books-stats"
version = "0.1.0"
description = "Books Stats"
readme = "README.md"
authors = [
    { name = "Ankit Gupta", email = "ankitgupta38017@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.13.4",
    "pytest>=9.1.1",
    "ruff>=0.16.1",
]

[project.scripts]
books-stats = "books_stats:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"
